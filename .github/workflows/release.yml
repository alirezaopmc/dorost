name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, such as v0.2.0
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install PDF text tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Install Typst 0.15.1
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz \
            --output /tmp/typst.tar.xz
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  /tmp/typst.tar.xz" \
            | sha256sum --check --strict
          tar -xJf /tmp/typst.tar.xz -C /tmp
          echo "/tmp/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Verify package and release version
        env:
          DOROST_ARTIFACT_DIR: ${{ runner.temp }}/checked-pdfs
        run: |
          ./scripts/check.sh
          git rev-parse --quiet --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          python3 scripts/release-notes.py "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          mkdir -p "$RUNNER_TEMP/release-pdfs"
          cp "$DOROST_ARTIFACT_DIR"/example-*.pdf "$RUNNER_TEMP/release-pdfs/"
          test -s "$RUNNER_TEMP/release-pdfs/example-showcase.pdf"
          ./scripts/render-showcase.sh "$RUNNER_TEMP/showcase"
          cp "$RUNNER_TEMP/showcase/"*.pdf "$RUNNER_TEMP/release-pdfs/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-pdfs
          path: ${{ runner.temp }}/release-pdfs/*.pdf
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-pdfs
          path: ${{ runner.temp }}/release-pdfs
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Dorost $TAG" \
              --notes-file "$RUNNER_TEMP/release/release-notes.md"
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "Dorost $TAG" \
              --notes-file "$RUNNER_TEMP/release/release-notes.md"
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/release-pdfs/"*.pdf --clobber
