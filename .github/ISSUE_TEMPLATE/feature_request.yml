name: Feature request
description: Suggest a small, general-purpose addition.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested API or behavior
      description: Prefer native Typst composition and independent configuration.
    validations:
      required: true
