name: Bug report
description: Report a reproducible Dorost problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the smallest Typst source that reproduces the issue.
    validations:
      required: true
  - type: input
    id: typst-version
    attributes:
      label: Typst version
      placeholder: 0.15.1
    validations:
      required: true
  - type: input
    id: dorost-version
    attributes:
      label: Dorost version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and compile target
      placeholder: macOS 15, PDF
    validations:
      required: false
  - type: textarea
    id: fonts
    attributes:
      label: Font setup
      description: Were Lora, Vazirmatn, and JetBrains Mono installed or supplied with --font-path?
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
