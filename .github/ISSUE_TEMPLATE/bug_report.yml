name: Bug report
description: Report a reproducible Dorost problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the smallest Typst source that reproduces the issue.
    validations:
      required: true
  - type: input
    id: typst-version
    attributes:
      label: Typst version
      placeholder: 0.15.1
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
